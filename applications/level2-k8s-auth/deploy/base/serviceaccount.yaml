apiVersion: v1
kind: ServiceAccount
metadata:
  name: level2-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level2-k8s-auth
# This name must match bound_service_account_names on the Vault role
# `level2-app` (Stage A Phase A6.6). All four levels share this namespace, so
# the ServiceAccount name is the entire isolation boundary (Stage B D15).
