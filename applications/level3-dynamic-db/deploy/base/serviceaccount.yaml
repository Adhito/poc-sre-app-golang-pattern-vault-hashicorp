apiVersion: v1
kind: ServiceAccount
metadata:
  name: level3-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level3-dynamic-db
# Must match bound_service_account_names on the Vault role `level3-app`
# (Stage A Phase A6.6), which grants the `level3-db` policy: read on
# database/creds/level3-app, update on sys/leases/renew and sys/leases/lookup.
