# WRITTEN IN B0/B4, ACTIVATED AND TESTED IN PHASE B5. See level1's copy for why
# it is not in `resources:` yet.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: level4-pgp-decrypt
  namespace: poc-hashicorp-vault-application
  labels:
    app: level4-pgp-decrypt
spec:
  podSelector:
    matchLabels:
      app: level4-pgp-decrypt
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Vault only. This pod holds the PGP private key in memory for its whole
    # life, so its egress surface is worth keeping as small as any in the POC.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - { protocol: TCP, port: 8200 }
