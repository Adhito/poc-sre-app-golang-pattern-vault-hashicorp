apiVersion: v1
kind: ServiceAccount
metadata:
  name: level4-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level4-pgp-decrypt
# Must match bound_service_account_names on the Vault role `level4-app`
# (Stage A Phase A6.6), which grants `level4-pgp`: read on secret/data/level4/pgp.
#
# This SA is the only thing standing between any other level and the PGP
# private key — the four levels share a namespace (D15). Phase B5's 4×4 matrix
# is what proves that boundary holds.
