apiVersion: v1
kind: ServiceAccount
metadata:
  name: level1-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level1-env-secret
# This ServiceAccount HAS a Vault role, `level1-app` (policy `level1-reader`),
# per Stage A Phase A6.6 — an owner decision recorded in
# documents/troubleshooting.md. The Stage B PRD (B1) says the opposite; the two
# PRDs disagree and the owner chose A6.6.
#
# The application never uses it. Level 1 never authenticates to Vault — ESO does
# that on the app's behalf with the `eso` role. The role exists so the Phase B5
# privilege matrix can test this SA's row as written (`level1/app` allow,
# everything else deny). The Deployment sets automountServiceAccountToken: false,
# so the running pod holds no token to log in with.
