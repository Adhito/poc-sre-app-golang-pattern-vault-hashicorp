apiVersion: v1
kind: ServiceAccount
metadata:
  name: level1-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level1-env-secret
# This ServiceAccount is granted NO Vault role, deliberately (PRD Stage B, B1).
# Level 1 never authenticates to Vault — ESO does it on the app's behalf with
# the `eso` role. The absence of a binding here is the demonstration.
