# external-secrets.io/v1. The cluster runs ESO v2.11.0, whose ExternalSecret CRD
# serves v1 only — v1beta1 is present but served=false, so a v1beta1 manifest is
# rejected outright (checked on the cluster 2026-10-31). This briefly read
# v1beta1 while ESO was pinned to 0.13 for Kubernetes 1.29; the cluster is now on
# 1.36. Check the served versions before changing this:
#   kubectl get crd externalsecrets.external-secrets.io \
#     -o jsonpath='{range .spec.versions[*]}{.name} served={.served}{"\n"}{end}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: level1-app
  namespace: poc-hashicorp-vault-application
  labels:
    app: level1-env-secret
spec:
  # 30s makes the staleness demo quick: the Secret below updates within this
  # window, and the running pod's environment still does not (Phase B1, step 6).
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend          # ClusterSecretStore from Stage A Phase A8
    kind: ClusterSecretStore
  target:
    name: level1-app-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_GREETING
      remoteRef:
        # KV v2 via ESO: the mount is configured on the ClusterSecretStore, so
        # the key here is the CLI-visible path without the `data/` segment.
        # This differs from a hand-written policy or a raw API call, which need
        # `secret/data/level1/app` — see Level 2.
        key: level1/app
        property: greeting
    - secretKey: APP_API_KEY
      remoteRef:
        key: level1/app
        property: api_key
